name: CEO loop

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: 'Niche folder (empty = rotate). Example: Aquarius Academy'
        required: false
        default: ""

concurrency:
  group: ceo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ceo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper yt-dlp certifi pillow 'moviepy>=2.0'

      - name: Write per-project YouTube secrets
        env:
          AQUARIUS_YOUTUBE_CLIENT_ID: ${{ secrets.AQUARIUS_YOUTUBE_CLIENT_ID }}
          AQUARIUS_YOUTUBE_CLIENT_SECRET: ${{ secrets.AQUARIUS_YOUTUBE_CLIENT_SECRET }}
          AQUARIUS_YOUTUBE_REFRESH_TOKEN: ${{ secrets.AQUARIUS_YOUTUBE_REFRESH_TOKEN }}
          GUDASOL_YOUTUBE_CLIENT_ID: ${{ secrets.GUDASOL_YOUTUBE_CLIENT_ID }}
          GUDASOL_YOUTUBE_CLIENT_SECRET: ${{ secrets.GUDASOL_YOUTUBE_CLIENT_SECRET }}
          GUDASOL_YOUTUBE_REFRESH_TOKEN: ${{ secrets.GUDASOL_YOUTUBE_REFRESH_TOKEN }}
        run: |
          mkdir -p "Aquarius Academy" Gudasol
          {
            echo "YOUTUBE_CLIENT_ID=${AQUARIUS_YOUTUBE_CLIENT_ID}"
            echo "YOUTUBE_CLIENT_SECRET=${AQUARIUS_YOUTUBE_CLIENT_SECRET}"
            echo "YOUTUBE_REFRESH_TOKEN=${AQUARIUS_YOUTUBE_REFRESH_TOKEN}"
            echo "YOUTUBE_TITLE_PREFIX=Aquarius Academy |"
            echo "YOUTUBE_TAGS=Aquarius Academy,consciousness,universal consciousness"
          } > "Aquarius Academy/.env"
          {
            echo "YOUTUBE_CLIENT_ID=${GUDASOL_YOUTUBE_CLIENT_ID}"
            echo "YOUTUBE_CLIENT_SECRET=${GUDASOL_YOUTUBE_CLIENT_SECRET}"
            echo "YOUTUBE_REFRESH_TOKEN=${GUDASOL_YOUTUBE_REFRESH_TOKEN}"
            echo "YOUTUBE_TITLE_PREFIX=Gudasol AI |"
            echo "YOUTUBE_TAGS=Gudasol AI,EASY"
          } > "Gudasol/.env"

      - name: Run CEO
        env:
          PROJECT: ${{ github.event.inputs.project }}
        run: |
          if [ -n "$PROJECT" ]; then
            python tools/ceo.py run --project "$PROJECT"
          else
            python tools/ceo.py run
          fi

      - name: Stage awaiting short artifact
        if: always()
        run: |
          mkdir -p data/artifact
          if [ -f data/awaiting-short.txt ]; then
            cp data/awaiting-short.txt data/artifact/
            path="$(sed -n '2p' data/awaiting-short.txt)"
            if [ -n "$path" ] && [ -f "$path" ]; then
              cp "$path" data/artifact/
            fi
          fi

      - name: Upload awaiting short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awaiting-short
          path: data/artifact/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit store
        if: always()
        run: |
          git config user.name "ceo-bot"
          git config user.email "ceo-bot@users.noreply.github.com"
          git add data/ceo.sqlite data/ceo-status.md || true
          git add "Aquarius Academy/search-terms.md" "Gudasol/search-terms.md" || true
          if git diff --cached --quiet; then
            echo "no store changes"
          else
            git commit -m "ceo: update store and status"
            git push
          fi
